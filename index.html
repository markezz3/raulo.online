<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raulo Online</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
* {
    transition: all 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes glow {
    0% { box-shadow: 0 0 10px rgba(79, 195, 247, 0.3); }
    50% { box-shadow: 0 0 20px rgba(79, 195, 247, 0.6); }
    100% { box-shadow: 0 0 10px rgba(79, 195, 247, 0.3); }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

body {
    margin: 0;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    color: #e5e5e5;
    font-family: 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
    animation: fadeIn 0.8s ease-out;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overflow-y: auto;
    overflow-x: hidden;
}

.subtitle {
    position: absolute;
    top: 15px;
    font-size: 0.7rem;
    color: #4fc3f7;
    letter-spacing: 3px;
    font-weight: 600;
    animation: fadeIn 1s ease-out 0.2s backwards;
}

h1 {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    margin-bottom: 20px;
    background: linear-gradient(135deg, #4fc3f7, #81c784);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeIn 1s ease-out 0.4s backwards;
    font-weight: 700;
}

.btn {
    border: 2px solid #4fc3f7;
    padding: 12px 30px;
    background: transparent;
    color: #4fc3f7;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    animation: fadeIn 1s ease-out 0.6s backwards;
}

.btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #4fc3f7, transparent);
    transition: left 0.5s ease;
    opacity: 0.3;
}

.btn:hover::before {
    left: 100%;
}

.btn:hover {
    background: #4fc3f7;
    color: #0a0a0a;
    box-shadow: 0 0 20px rgba(79, 195, 247, 0.6);
    transform: translateY(-2px);
}

.btn:active {
    transform: translateY(0);
}

.terminal {
    margin-top: 25px;
    width: 100%;
    max-width: 700px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border-radius: 12px;
    padding: 25px;
    display: none;
    font-family: 'Courier New', monospace;
    font-size: clamp(0.75rem, 2vw, 0.9rem);
    border: 1px solid rgba(79, 195, 247, 0.2);
    animation: slideIn 0.5s ease-out;
    box-shadow: 0 8px 32px rgba(79, 195, 247, 0.1);
}

.cmd { 
    color: #4fc3f7; 
    font-weight: 600;
    animation: slideIn 0.3s ease-out;
}

.label { 
    color: #ce93d8; 
    font-weight: 500;
    animation: slideIn 0.3s ease-out;
}

.value { 
    color: #81c784; 
    animation: slideIn 0.3s ease-out;
}

.progress {
    height: 8px;
    background: rgba(79, 195, 247, 0.1);
    margin: 15px 0;
    border-radius: 4px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4fc3f7, #81c784);
    border-radius: 4px;
    box-shadow: 0 0 10px rgba(79, 195, 247, 0.8);
}

.sections {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 40px;
    justify-content: center;
    width: 100%;
    max-width: 1200px;
    padding: 0 10px;
}

.box {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #a9d7ec;
    background: rgba(26, 26, 46, 0.5);
    padding: 30px;
    border-radius: 16px;
    border: 1px solid rgba(79, 195, 247, 0.15);
    animation: fadeIn 0.8s ease-out;
    transition: all 0.3s ease;
}

.box:hover {
    border-color: rgba(79, 195, 247, 0.5);
    box-shadow: 0 8px 32px rgba(79, 195, 247, 0.15);
    transform: translateY(-5px);
}

.box h3 {
    margin-bottom: 20px;
    text-align: center;
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    color: #4fc3f7;
    font-weight: 700;
}

.box button {
    display: block;
    width: 100%;
    max-width: 180px;
    margin: 12px 0;
    padding: 14px 20px;
    background: linear-gradient(135deg, #4fc3f7, #00bcd4);
    border: none;
    color: #fff;
    cursor: pointer;
    border-radius: 12px;
    font-weight: 700;
    position: relative;
    overflow: hidden;
    font-size: 0.95rem;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 15px rgba(79, 195, 247, 0.3);
    transition: all 0.3s ease;
}

.box button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #00bcd4, #4fc3f7);
    transition: left 0.4s ease;
    z-index: -1;
}

.box button:hover::before {
    left: 0;
}

.box button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(79, 195, 247, 0.6);
}

.box button:active {
    transform: translateY(-1px);
}

.reset-btn {
    margin-top: 30px;
    display: none;
    animation: fadeIn 0.5s ease-out;
}

a {
    text-decoration: none;
    color: inherit;
}

.description {
    margin-top: 15px;
    max-width: 600px;
    text-align: center;
    font-size: clamp(0.8rem, 2vw, 0.95rem);
    color: #99a8b8;
    line-height: 1.6;
    animation: fadeIn 1s ease-out 0.3s backwards;
}

.divider {
    width: 80%;
    height: 2px;
    margin: 60px auto;
    background: linear-gradient(90deg, transparent, #4fc3f7, #81c784, transparent);
    border-radius: 1px;
    animation: fadeIn 1s ease-out 0.5s backwards;
}

/* Media Queries para Responsive */
@media (max-width: 768px) {
    body {
        padding: 30px 15px;
    }
    
    h1 {
        margin-bottom: 15px;
    }
    
    .subtitle {
        font-size: 0.65rem;
    }
    
    .terminal {
        max-width: 100%;
        padding: 20px;
        font-size: 0.8rem;
        max-height: 50vh;
        overflow-y: auto;
    }
    
    .sections {
        gap: 20px;
        grid-template-columns: repeat(2, 1fr);
        max-width: 100%;
    }
    
    .box {
        padding: 20px;
        width: 100%;
    }
    
    .box button {
        max-width: 150px;
        padding: 12px 18px;
    }
    
    .divider {
        margin: 45px auto;
    }
}

@media (max-width: 600px) {
    .sections {
        grid-template-columns: 1fr;
        gap: 15px;
    }
    
    .box {
        padding: 18px;
    }
    
    .box button {
        max-width: 100%;
        padding: 12px 16px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 20px 12px;
        min-height: 100vh;
    }
    
    h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
    }
    
    .btn {
        padding: 10px 20px;
        font-size: 0.9rem;
    }
    
    .terminal {
        padding: 15px;
        font-size: 0.75rem;
        max-width: 100%;
        max-height: 50vh;
        overflow-y: auto;
    }
    
    .sections {
        gap: 12px;
        grid-template-columns: 1fr;
        padding: 0 5px;
    }
    
    .box {
        padding: 15px;
        gap: 10px;
    }
    
    .box h3 {
        font-size: 1.1rem;
        margin-bottom: 15px;
    }
    
    .box button {
        max-width: 100%;
        padding: 10px 14px;
        font-size: 0.85rem;
    }
}

.login-info {

@media (max-width: 480px) {

</style>

<script>
const terminal = document.getElementById("terminal");

function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

function type(text, cls){
    return new Promise(resolve=>{
        let el = document.createElement("div");
        el.className = cls;
        terminal.appendChild(el);

        let i=0;
        function write(){
            if(i<text.length){
                el.textContent += text[i++];
                setTimeout(write,15);
            } else resolve();
        }
        write();
    });
}

function getBrowser(){
    let ua=navigator.userAgent;
    if(ua.includes("Edg")) return "Edge";       // Con este orden, detectamos Edge antes que Chrome, ya que Edge también incluye "Chrome" en su user agent
    if(ua.includes("Chrome")) return "Chrome";
    if(ua.includes("Safari") && !ua.includes("Chrome")) return "Safari";
    if(ua.includes("Firefox")) return "Firefox";
    return "Unknown";
}

function getOS(){
    let ua=navigator.userAgent;
    if(ua.includes("Windows")) return "Windows";
    if(ua.includes("Android")) return "Android";
    if(ua.includes("iPhone")) return "iOS";
    return "Unknown";
}

function getScreenResolution(){
    return window.screen.width + "x" + window.screen.height;
}

function getTimezone(){
    return Intl.DateTimeFormat().resolvedOptions().timeZone;
}

function getLanguage(){
    return navigator.language || navigator.userLanguage;
}

function getConnectionType(){
    let connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return connection ? connection.effectiveType : "Unknown";
}

async function getPrivateIP(){
    return new Promise((resolve) => {
        let pc = new RTCPeerConnection({iceServers: []});
        pc.createDataChannel("");
        pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(e => {});
        
        pc.onicecandidate = (ice) => {
            if(!ice || !ice.candidate) return;
            let ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
            let ipAddr = ipRegex.exec(ice.candidate.candidate);
            if(ipAddr) {
                resolve(ipAddr[1]);
                pc.close();
            }
        };
        
        setTimeout(() => {
            resolve("Unavailable");
            pc.close();
        }, 2000);
    });
}

function getGPUInfo(){
    try {
        let canvas = document.createElement("canvas");
        let gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        let debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        let gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        return gpu || "Unknown";
    } catch(e) {
        return "Unavailable";
    }
}

function getCPUCores(){
    return navigator.hardwareConcurrency || "Unknown";
}

function getRAM(){
    return navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Unknown";
}

async function getBatteryInfo(){
    try {
        let battery = await navigator.getBattery();
        return Math.round(battery.level * 100) + "%";
    } catch(e) {
        return "Unavailable";
    }
}

function getDeviceType(){
    let ua = navigator.userAgent;
    if(/tablet|ipad|playbook|silk/i.test(ua)) return "Tablet";
    if(/mobile|android|iphone|ipod|blackberry|windows phone/i.test(ua)) return "Mobile";
    return "Desktop";
}

function getColorDepth(){
    return screen.colorDepth + " bits";
}

function getCookiesEnabled(){
    return navigator.cookieEnabled ? "Enabled" : "Disabled";
}

function getJavaEnabled(){
    return navigator.javaEnabled ? "Enabled" : "Disabled";
}

async function getStorageAvailable(){
    try {
        if(navigator.storage && navigator.storage.estimate) {
            let estimate = await navigator.storage.estimate();
            let available = (estimate.quota / (1024*1024*1024)).toFixed(2) + " GB";
            let used = (estimate.usage / (1024*1024*1024)).toFixed(2) + " GB";
            return used + " / " + available;
        }
        return "Unavailable";
    } catch(e) {
        return "Unavailable";
    }
}

function getDNT(){
    let dnt = navigator.doNotTrack;
    if(dnt === "1") return "Enabled";
    if(dnt === "0") return "Disabled";
    return "Unknown";
}

async function startScan(){
    terminal.innerHTML="";
    terminal.style.display="block";
    document.getElementById("startBtn").style.display="none";

    await type("> initializing scan...","cmd");

    let bar=document.createElement("div");
    bar.className="progress";
    let inner=document.createElement("div");
    inner.className="bar";
    bar.appendChild(inner);
    terminal.appendChild(bar);

    for(let i=0;i<=100;i++){
        inner.style.width=i+"%";
        await delay(15);
    }

    await type("> detecting environment...","cmd");

    await type("browser:","label");
    await type(getBrowser(),"value");

    await type("os:","label");
    await type(getOS(),"value");

    await type("screen_resolution:","label");
    await type(getScreenResolution(),"value");

    await type("language:","label");
    await type(getLanguage(),"value");

    await type("timezone:","label");
    await type(getTimezone(),"value");

    await type("> fetching network info...","cmd");

    await type("ip_public:","label");

    try{
        let r=await fetch("https://api.ipify.org?format=json");
        let d=await r.json();
        await type(d.ip,"value");
    }catch{
        await type("No disponible","value");
    }

    await type("ip_private:","label");
    let privateIP = await getPrivateIP();
    await type(privateIP,"value");

    await type("connection_type:","label");
    await type(getConnectionType(),"value");

    await type("> scanning system hardware...","cmd");

    await type("gpu_info:","label");
    await type(getGPUInfo(),"value");

    await type("cpu_cores:","label");
    await type(getCPUCores(),"value");

    await type("memory:","label");
    await type(getRAM(),"value");

    await type("device_type:","label");
    await type(getDeviceType(),"value");

    await type("color_depth:","label");
    await type(getColorDepth(),"value");

    await type("> scanning device capabilities...","cmd");

    await type("cookies:","label");
    await type(getCookiesEnabled(),"value");

    await type("java:","label");
    await type(getJavaEnabled(),"value");

    await type("dnt_header:","label");
    await type(getDNT(),"value");

    await type("battery:","label");
    let battery = await getBatteryInfo();
    await type(battery,"value");

    await type("storage:","label");
    let storage = await getStorageAvailable();
    await type(storage,"value");

    await type("> running internet speed test...","cmd");
    await type("download_speed:","label");

    let speed=(Math.random()*200+20).toFixed(2);
    await type(speed+" Mbps","value");

    await type("upload_speed:","label");
    let uploadSpeed=(Math.random()*100+10).toFixed(2);
    await type(uploadSpeed+" Mbps","value");

    await type("latency:","label");
    let latency=(Math.random()*50+5).toFixed(0);
    await type(latency+" ms","value");

    await type("> scan complete ✔","cmd");

    document.getElementById("resetBtn").style.display="block"; 
}

function reset(){
    terminal.style.display="none";
    document.getElementById("resetBtn").style.display="none"; 
    document.getElementById("startBtn").style.display="block";
}

// 🔽 FUNCIÓN DE LOGIN
function handleLogin(event) {
    event.preventDefault();
    
    const username = document.getElementById("username").value.toLowerCase();   // Convertir a minúsculas para evitar problemas de mayúsculas
    const password = document.getElementById("password").value;
    
    // Credenciales válidas
    const validCredentials = [
        { user: "admin", pass: "admin" },
        { user: "guest", pass: "guest" } 
    ];
    
    // Verificar si las credenciales son válidas
    const isValid = validCredentials.some(cred => 
        cred.user === username && cred.pass === password
    );
    
    if (isValid) {
        // Guardar que el usuario está autenticado (opcional)
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("username", username);
        
        // Redirigir a portal.html
        window.location.href = "portal.html";
    } else {
        alert("❌ Usuario o contraseña incorrectos.\n\nIntenta:\n- Contactar a un administrador\n- Presiona aceptar e intenta de nuevo");
        document.getElementById("loginForm").reset();
    }
}

// Verificar si ya está logueado
window.addEventListener("load", function() {
    const isLoggedIn = localStorage.getItem("isLoggedIn");
    if (isLoggedIn === "true") {
        // Si ya estaba logueado, ocultar el login automáticamente
        // (Esto permite que recarguen la página sin volver a loguear)
        document.getElementById("loginOverlay").classList.add("hidden");
    }
});
