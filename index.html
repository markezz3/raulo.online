<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raulo Online</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="page-shell">
    <div class="login-card">
        <div class="brand-block">
            <span class="brand-label">Raulo</span>
            <span class="brand-tag">Online</span>
        </div>
        <h1>Inicio de sesión</h1>
        <p class="lead">Introduce las credenciales para acceder al portal</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="login-btn">Iniciar Sesión</button>
            <a href="portal.html" class="guest-link" id="guestAccess">Ingresar como Invitado</a>
        </form>
 <!-- <p class="login-info">El sitio requiere de un usuario para continuar...</p> -->
    </div>
</div>
<script>
const validCredentials = [
    { user: "admin", pass: "admin" }
];

function handleLogin(event) {
    event.preventDefault();
    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const isValid = validCredentials.some(cred => cred.user === username && cred.pass === password);
    if (!isValid) {
        alert("Usuario o contraseña incorrectos. Intenta con admin/admin.");
        document.getElementById("loginForm").reset();
        return;
    }

    sessionStorage.setItem("isLoggedIn", "true");
    sessionStorage.setItem("username", username);
    window.location.href = "portal.html";
}

window.addEventListener("load", () => {
    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("username");
    sessionStorage.removeItem("isLoggedIn");
    sessionStorage.removeItem("username");
    document.getElementById("loginForm").addEventListener("submit", handleLogin);
    document.getElementById("guestAccess").addEventListener("click", () => {
        sessionStorage.setItem("isLoggedIn", "true");
        sessionStorage.setItem("username", "invitado");
    });
});
</script>
</body>
</html>
